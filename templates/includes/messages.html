{% if messages %}
<div id="message-container"
    class="fixed top-24 left-1/2 -translate-x-1/2 z-[9999] w-full max-w-xl px-4 pointer-events-none">

    {% for message in messages %}
    <div class="
        pointer-events-auto
        bg-green-500/70
        border border-green-300
        shadow-2xl shadow-green-500/50
        backdrop-blur-xl
        rounded-2xl
        px-6 py-4
        text-center
        text-white
        font-bold
        text-lg
    ">
        {{ message }}
    </div>
    {% endfor %}
</div>

<script>
    setTimeout(() => {
        const container = document.getElementById("message-container");

        if (container) {
            container.style.transition = "opacity 0.5s ease";
            container.style.opacity = "0";

            setTimeout(() => container.remove(), 500);
        }
    }, 6000);
</script>
{% endif %}
