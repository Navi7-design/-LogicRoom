{% extends "base.html" %}

{% block content %}

{% if error %}
<p class="text-red-500 text-lg mb-2 text-center">{{ error }}</p>
{% endif %}

<div class="bg-gray-100 min-h-screen flex justify-center items-start pt-6 md:items-center md:pt-0">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden w-full max-w-md md:max-w-4xl grid md:grid-cols-2">

        <!-- Картинка -->
        <div class="w-full h-48 md:h-auto">
            <img src="https://hotline.ua/img/uploads/clients/5e675e5402b38.jpg" class="h-full w-full object-cover">
        </div>

        <!-- Форма -->
        <div class="p-6">
            <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <!-- Username -->
                <input type="text" required name="username" placeholder="Username"
                    class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-400">

                <!-- Password -->
                <input type="password" required name="password" placeholder="Password"
                    class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-400">

                <button type="submit"
                    class="w-full bg-yellow-400 p-3 font-semibold rounded hover:bg-yellow-300 transition">
                    Sign In
                </button>
            </form>

            <p class="text-sm text-center mt-4">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-yellow-500 font-semibold">Sign up</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
